<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slice by Slice: My NYC Pizza Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2e2b29;--paper:#f3efe5;--card:#fffaf1;--tomato:#d9473a;--muted:#7a7066;--soft:#efe7d8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
#map{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
#grain{position:fixed;inset:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55}

/* scene */
.tile .lift{animation:drop .9s cubic-bezier(.2,.9,.25,1) backwards;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
@keyframes drop{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
#map.ov .tile.hood{cursor:pointer}
#map.ov .tile.hood:hover .lift{transform:translateY(-10px)}
.wave{animation:shimmer 4s ease-in-out infinite}
@keyframes shimmer{0%,100%{opacity:.95}50%{opacity:.25}}
.pin{cursor:pointer;outline:none}
.pin .pbody{transform-box:fill-box;transform-origin:50% 100%;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.pin:hover .pbody,.pin:focus-visible .pbody{transform:scale(1.18) translateY(-2px)}
.pin.active .pbody{transform:scale(1.22) translateY(-3px)}
.pin .ring{opacity:0}
.pin.active .ring{opacity:1;animation:ring 1.6s ease-out infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes ring{from{transform:scale(.6);opacity:.9}to{transform:scale(2.2);opacity:0}}
.pin .tag{opacity:0;transition:opacity .25s;pointer-events:none}
#map.near .pin .tag{opacity:1}
.pins-in{animation:pinin .6s cubic-bezier(.3,1.5,.5,1) backwards}
@keyframes pinin{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:none}}
.tlabel{cursor:pointer}
.tlabel rect{transition:fill .2s}
.tlabel:hover rect.lb{fill:#fff}

/* chrome */
header{position:fixed;left:12px;top:10px;max-width:400px;pointer-events:none;z-index:5;padding:12px 16px 14px;border-radius:18px;border:1.5px solid transparent;transition:background .3s,box-shadow .3s,border-color .3s}
body.zoomed header{background:var(--card);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink);padding:9px 16px 10px}
body.zoomed header p,body.zoomed .hint{display:none}
body.zoomed header h1{font-size:30px;margin-bottom:0}
body.zoomed header .kicker{font-size:10.5px}
@media (min-width:761px){body.panel-open .hoodbar{left:calc((100vw - 434px)/2)}}
#sky{transition:opacity .6s}
#map.near #sky{opacity:0}
header .kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--tomato);font-weight:700}
header h1{font-family:Fraunces,Georgia,serif;font-size:46px;line-height:.98;margin:.12em 0 .22em;font-weight:800;letter-spacing:-.015em}
header h1 span{color:var(--tomato)}
header p{margin:0;font-size:14.5px;line-height:1.45;color:#4d463f;max-width:340px}
.controls{position:fixed;right:22px;top:22px;display:flex;gap:9px;z-index:6}
.btn{font:700 14px/1 'DM Sans',system-ui,sans-serif;border:1.5px solid var(--ink);background:var(--card);color:var(--ink);padding:10px 15px;border-radius:999px;box-shadow:2px 2px 0 var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .12s,box-shadow .12s,background .2s;white-space:nowrap}
.btn:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
.btn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--tomato);color:#fff}
.btn[hidden]{display:none}
.btn svg{width:15px;height:15px}
.hint{position:fixed;left:26px;bottom:20px;font-size:12.5px;color:var(--muted);z-index:4;pointer-events:none}

.panel{position:fixed;top:82px;right:22px;bottom:22px;width:390px;background:var(--card);border:1.5px solid var(--ink);border-radius:20px;box-shadow:5px 5px 0 var(--ink);transform:translateX(calc(100% + 60px));transition:transform .5s cubic-bezier(.2,.85,.2,1);overflow:auto;z-index:7;overscroll-behavior:contain}
.panel.open{transform:none}
.panel .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--ink);background:#fff;cursor:pointer;font-size:18px;line-height:1;display:grid;place-items:center;color:var(--ink)}
.panel .x:hover{background:var(--soft)}
.cardin{padding:24px 24px 18px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--soft);border:1.5px solid var(--ink);padding:5px 10px;border-radius:999px}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;border:1px solid var(--ink)}
.cardin h2{font-family:Fraunces,Georgia,serif;font-size:31px;line-height:1.05;margin:14px 44px 6px 0;font-weight:800;letter-spacing:-.01em}
.addr{margin:0 0 18px;color:var(--muted);font-size:14px;display:flex;gap:6px;align-items:flex-start}
.addr svg{flex:none;margin-top:2px}
.rating{display:flex;align-items:center;gap:16px;border:1.5px solid var(--ink);border-radius:16px;padding:14px 16px;background:#fff}
.score{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:44px;line-height:1;min-width:86px}
.score small{font-size:17px;color:var(--muted);font-weight:600;margin-left:2px}
.score.empty{color:#c9beb0}
.rmeta{flex:1}
.slices{display:flex;gap:4px;margin-bottom:5px}
.slices svg{width:24px;height:24px}
.rnote{font-size:13px;color:var(--muted)}
.sect{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:22px 0 9px;color:var(--ink)}
.review{font-size:15.5px;line-height:1.6;margin:0;white-space:pre-line}
.review.ph{color:var(--muted);border:1.5px dashed #c8bcad;border-radius:14px;padding:14px 16px;background:repeating-linear-gradient(-45deg,transparent 0 9px,rgba(201,190,176,.12) 9px 18px)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos figure{margin:0;aspect-ratio:4/3;border-radius:14px;overflow:hidden;border:1.5px solid var(--ink);background:#fff}
.photos figure img{width:100%;height:100%;object-fit:cover;display:block}
.photos figure.ph{border:1.5px dashed #c8bcad;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:12.5px;background:repeating-linear-gradient(-45deg,transparent 0 9px,rgba(201,190,176,.12) 9px 18px)}
.photos figure.ph svg{display:block;margin:0 auto 6px;opacity:.7}
.cardnav{display:flex;align-items:center;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1.5px dashed #d9cfc1;font-size:13px;color:var(--muted)}
.cardnav .btn{padding:8px 12px;font-size:13px}

.list .cardin h2{margin-top:0}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;margin:2px 0 16px}
.seg button{font:700 13px 'DM Sans',sans-serif;background:#fff;border:0;padding:7px 13px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--ink);color:#fff}
.grp{margin:0 0 16px}
.grp h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:7px}
.grp h4 i{width:9px;height:9px;border-radius:50%;border:1px solid var(--ink)}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--ink);border-radius:13px;padding:10px 12px;margin-bottom:7px;cursor:pointer;font:inherit;color:inherit;transition:transform .12s,box-shadow .12s}
.item:hover{transform:translate(-1px,-1px);box-shadow:2px 2px 0 var(--ink)}
.item .nm{font-weight:700;font-size:15px}
.item .ad{font-size:12.5px;color:var(--muted);margin-top:2px}
.item .bd{margin-left:auto;font-family:Fraunces,Georgia,serif;font-weight:800;font-size:18px;min-width:44px;text-align:right}
.item .bd.empty{color:#c9beb0;font-size:15px}
.item .rk{font-family:Fraunces,Georgia,serif;font-weight:800;width:22px;color:var(--tomato)}

.hoodbar{position:fixed;left:50%;bottom:20px;transform:translate(-50%,140%);transition:transform .45s cubic-bezier(.2,.85,.2,1);display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--ink);border-radius:999px;padding:7px 8px 7px 16px;box-shadow:3px 3px 0 var(--ink);z-index:5;max-width:calc(100vw - 40px);overflow-x:auto;scrollbar-width:none}
.hoodbar::-webkit-scrollbar{display:none}
.hoodbar.show{transform:translate(-50%,0)}
.hoodbar b{font-family:Fraunces,Georgia,serif;font-size:16px;white-space:nowrap;margin-right:4px}
.hoodbar button{font:700 13px 'DM Sans',sans-serif;border:1.5px solid var(--ink);background:#fff;border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap;color:var(--ink)}
.hoodbar button:hover,.hoodbar button.on{background:var(--tomato);color:#fff}

@media (max-width:760px){
  header{left:16px;top:14px;right:16px}
  header h1{font-size:30px}
  header p{font-size:13px}
  header .kicker{font-size:10.5px}
  .controls{top:auto;bottom:14px;right:12px;left:12px;justify-content:center;gap:7px}
  .btn{padding:9px 12px;font-size:13px}
  .hint{display:none}
  .panel{left:0;right:0;bottom:0;top:auto;width:auto;max-height:74vh;border-radius:20px 20px 0 0;border-bottom:0;box-shadow:0 -3px 0 var(--ink);transform:translateY(105%)}
  .panel.open{transform:none}
  .hoodbar{bottom:64px}
  .cardin h2{font-size:26px}
  body.zoomed header{left:10px;right:auto;top:10px;padding:7px 12px 8px}
  body.zoomed header .kicker{display:none}
  body.zoomed header h1{font-size:22px}
}
@media (prefers-reduced-motion:reduce){.tile .lift,.pins-in{animation:none}.wave{animation:none}}
</style>
</head>
<body>
<svg id="map" class="ov" xmlns="http://www.w3.org/2000/svg" aria-label="Isometric map of New York City and Hoboken pizza spots">
  <defs>
    <pattern id="cobble" width="9" height="6" patternUnits="userSpaceOnUse">
      <rect width="9" height="6" fill="#d9d1c2"/>
      <ellipse cx="2.4" cy="1.6" rx="1.9" ry="1.1" fill="#cbc2b1"/>
      <ellipse cx="6.9" cy="4.6" rx="1.9" ry="1.1" fill="#cbc2b1"/>
    </pattern>
    <pattern id="pavers" width="12" height="7" patternUnits="userSpaceOnUse">
      <rect width="12" height="7" fill="#ece4d4"/>
      <path d="M0 3.5h12M6 0v3.5M0 7V3.5" stroke="#dcd2bf" stroke-width=".8" fill="none"/>
    </pattern>
  </defs>
  <g id="world" stroke="#2e2b29" stroke-width=".9" stroke-linejoin="round" stroke-linecap="round">
    <g id="scene"></g>
    <g id="sky"></g>
    <g id="labels"></g>
    <g id="pins"></g>
  </g>
</svg>
<div id="grain"></div>

<header>
  <div class="kicker">NYC + Hoboken · summer pizza tour</div>
  <h1>Slice <span>by</span> Slice</h1>
  <p>13 pizzerias across 6 neighborhoods. Pick a neighborhood to zoom in, then tap a pin for my rating and review.</p>
</header>

<div class="controls">
  <button class="btn" id="bOverview" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg>Whole map</button>
  <button class="btn" id="bTour"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg><span>Take the tour</span></button>
  <button class="btn primary" id="bList"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 3.5h12M2 8h12M2 12.5h12"/></svg>All 13 spots</button>
</div>

<div class="hint">Drag to pan · scroll or pinch to zoom · click a neighborhood</div>
<div class="hoodbar" id="hoodbar"></div>

<aside class="panel" id="card" aria-hidden="true"><button class="x" data-close aria-label="Close">✕</button><div class="cardin" id="cardin"></div></aside>
<aside class="panel list" id="list" aria-hidden="true"><button class="x" data-close aria-label="Close">✕</button><div class="cardin" id="listin"></div></aside>

<script>
/* =====================================================================
   YOUR REVIEWS LIVE HERE
   For each spot fill in:
     rating : a number out of 10 (e.g. 8.5)  — leave null until you decide
     review : your write-up (plain text, line breaks are kept)
     photos : up to two images (data: URLs or images bundled with the page)
   ===================================================================== */
const RATING_MAX = 10;
const PLACES = [
  {id:'bennys',     hood:'hoboken', name:"Benny Tudino's",          address:"622 Washington St, Hoboken, NJ 07030", rating:null, review:"", photos:[null,null]},
  {id:'basiles',    hood:'hoboken', name:"Basile's Pizza",          address:"89 Washington St, Hoboken, NJ 07030",  rating:null, review:"", photos:[null,null]},
  {id:'panello',    hood:'hoboken', name:"Panello",                 address:"720 Monroe St, Hoboken, NJ 07030",     rating:null, review:"", photos:[null,null]},
  {id:'pops',       hood:'midtown', name:"Pop's Pizza",             address:"975 8th Ave, New York, NY 10019",      rating:null, review:"", photos:[null,null]},
  {id:'lazzaras',   hood:'midtown', name:"Lazzara's Pizza Cafe",    address:"221 W 38th St (2nd floor), New York, NY 10018", rating:null, review:"", photos:[null,null]},
  {id:'lindustrie', hood:'village', name:"L'Industrie Pizzeria",    address:"104 Christopher St, New York, NY 10014", rating:null, review:"", photos:[null,null]},
  {id:'mamas',      hood:'village', name:"Mama's Too",              address:"325 Bleecker St, New York, NY 10014",  rating:null, review:"", photos:[null,null]},
  {id:'johns',      hood:'village', name:"John's of Bleecker Street", address:"278 Bleecker St, New York, NY 10014", rating:null, review:"", photos:[null,null]},
  {id:'joes',       hood:'village', name:"Joe's Pizza",             address:"7 Carmine St, New York, NY 10014",     rating:null, review:"", photos:[null,null]},
  {id:'upside',     hood:'fidi',    name:"Upside Pizza",            address:"65 Wall St, New York, NY 10005",       rating:null, review:"", photos:[null,null]},
  {id:'ignazios',   hood:'dumbo',   name:"Ignazio's Pizza",         address:"4 Water St, Brooklyn, NY 11201",       rating:null, review:"", photos:[null,null]},
  {id:'grimaldis',  hood:'dumbo',   name:"Grimaldi's Pizzeria",     address:"1 Front St, Brooklyn, NY 11201",       rating:null, review:"", photos:[null,null]},
  {id:'difara',     hood:'midwood', name:"Di Fara Pizza",           address:"1424 Avenue J, Brooklyn, NY 11230",    rating:null, review:"", photos:[null,null]},
];
const HOODS = {
  hoboken:{name:'Hoboken',            sub:'New Jersey', color:'#7fb2d9'},
  midtown:{name:'Midtown West',       sub:'Manhattan',  color:'#f2c230'},
  village:{name:'West Village',       sub:'Manhattan',  color:'#e9806a'},
  fidi:   {name:'Financial District', sub:'Manhattan',  color:'#9fc28a'},
  dumbo:  {name:'DUMBO',              sub:'Brooklyn',   color:'#c58ad1'},
  midwood:{name:'Midwood',            sub:'Brooklyn',   color:'#f0a35e'},
};
const TOUR = ['hoboken','midtown','village','fidi','dumbo','midwood'];

/* =====================================================================
   ISOMETRIC DRAWING ENGINE
   ===================================================================== */
const S = 22, CX = Math.cos(Math.PI/6), HY = .5;
const INK = '#2e2b29';
const C_TILE='#f1ece2', C_ROAD='#dcd6ca', C_LINE='#e8bb4f', C_GRASS='#b6d98f', C_WATER='#a7d0ec', C_WIN='#cfe2ee', C_STONE='#cdb99a';
const TREES=['#86b96a','#7aae5f','#93c374','#8fbf6a'];
const SHIRTS=['#d94a3a','#3f7fbf','#f2c230','#5aa469','#8e6cc2','#f08a4b','#2f3a48','#ece4d5','#e07aa0','#58b5c9','#c0392b','#ffffff'];
const PANTS=['#2f3a48','#3d4f7a','#5a4636','#6b6f78','#22303c','#7a8a9a'];
const SKIN=['#f3cfb1','#e3b08c','#c68b62','#9a6544','#6e4630','#f1d4c0'];
const HAIR=['#2b2420','#5a3a22','#c9a066','#1c1c1c','#8a5a3a','#d9d2c5','#b5532f'];

let seed = 20260718;
const rnd = () => (seed = (seed*16807) % 2147483647, (seed-1)/2147483646);
const pick = a => a[Math.floor(rnd()*a.length)];
const rr = (a,b) => a + rnd()*(b-a);

const iso = (x,y,z=0) => [(x-y)*CX*S, (x+y)*HY*S - z*S];
const f1 = n => Math.round(n*10)/10;
const pts = a => a.map(p => f1(p[0])+','+f1(p[1])).join(' ');
const poly = (a,fill,ex='') => `<polygon points="${pts(a)}" fill="${fill}"${ex?' '+ex:''}/>`;
const ln = (a,b,stroke=INK,w=.8,ex='') => `<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" stroke="${stroke}" stroke-width="${w}"${ex?' '+ex:''}/>`;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function hx(c){c=c.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');return [0,2,4].map(i=>parseInt(c.substr(i,2),16));}
function toHex(a){return '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');}
function mixc(a,b,t){const A=hx(a),B=hx(b);return toHex(A.map((v,i)=>v+(B[i]-v)*t));}
const lt=(c,t=.14)=>mixc(c,'#ffffff',t), dk=(c,t=.14)=>mixc(c,'#1d1a2a',t);

/* box: [x,x+w]×[y,y+d]×[z,z+h]; visible faces: L (y+d, faces +y), R (x+w, faces +x), top */
function box(x,y,z,w,d,h,c,o={}){
  const top=o.top||lt(c,.18), L=o.L||c, R=o.R||dk(c,.13), ex=o.ex||'';
  const a=iso(x,y,z+h), b=iso(x+w,y,z+h), cc=iso(x+w,y+d,z+h), dd=iso(x,y+d,z+h);
  const b0=iso(x+w,y,z), c0=iso(x+w,y+d,z), d0=iso(x,y+d,z);
  let s='';
  if(!o.noL) s+=poly([dd,cc,c0,d0],L,ex);
  if(!o.noR) s+=poly([cc,b,b0,c0],R,ex);
  if(!o.noTop) s+=poly([a,b,cc,dd],top,ex);
  return s;
}
const faceL=(x,y,z,w,d)=>({L:w,at:(u,v,o=0)=>iso(x+u,y+d+o,z+v),m:[CX,HY]});
const faceR=(x,y,z,w,d)=>({L:d,at:(u,v,o=0)=>iso(x+w+o,y+d-u,z+v),m:[CX,-HY]});
const frect=(F,u0,v0,u1,v1,fill,ex='')=>poly([F.at(u0,v0),F.at(u1,v0),F.at(u1,v1),F.at(u0,v1)],fill,ex);
function ftext(F,u,v,str,size,fill,o={}){
  const p=F.at(u,v,.02);
  return `<text transform="matrix(${F.m[0].toFixed(4)},${F.m[1].toFixed(4)},0,1,${f1(p[0])},${f1(p[1])})" font-size="${size}" fill="${fill}" text-anchor="middle" dominant-baseline="central" stroke="none" font-weight="${o.w||700}" font-family="${o.font||"DM Sans, Arial, sans-serif"}" letter-spacing="${o.ls||.2}">${esc(str)}</text>`;
}
function cyl(x,y,z,r,h,fill,top,ex=''){
  const b=iso(x,y,z), t=iso(x,y,z+h), rx=1.2247*r*S, ry=.7071*r*S;
  return `<path d="M${f1(b[0]-rx)} ${f1(t[1])}L${f1(b[0]-rx)} ${f1(b[1])}A${f1(rx)} ${f1(ry)} 0 0 0 ${f1(b[0]+rx)} ${f1(b[1])}L${f1(b[0]+rx)} ${f1(t[1])}" fill="${fill}"${ex?' '+ex:''}/>`+
         `<ellipse cx="${f1(t[0])}" cy="${f1(t[1])}" rx="${f1(rx)}" ry="${f1(ry)}" fill="${top||lt(fill,.2)}"${ex?' '+ex:''}/>`;
}
function cone(x,y,z,r,h,fill){
  const b=iso(x,y,z), rx=1.2247*r*S, ry=.7071*r*S;
  return `<path d="M${f1(b[0]-rx)} ${f1(b[1])}L${f1(b[0])} ${f1(b[1]-h*S)}L${f1(b[0]+rx)} ${f1(b[1])}A${f1(rx)} ${f1(ry)} 0 0 1 ${f1(b[0]-rx)} ${f1(b[1])}Z" fill="${fill}"/>`;
}
function circlePts(cx,cy,r,z=.03,n=32){const a=[];for(let i=0;i<n;i++){const t=i/n*Math.PI*2;a.push(iso(cx+Math.cos(t)*r,cy+Math.sin(t)*r,z));}return a;}

/* --- building parts --- */
function windowsSVG(F,cols,rows,v0,v1,ww,wh,c,litP=.13){
  let s=''; const du=F.L/cols, dv=(v1-v0)/rows; ww=Math.min(ww,du-.18);
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){

const T1=15.3, T2=20.7, ZT=9.0, ZM=3.6, YA=5.5, YB=23.2, ZA=2.9;
function cableZ(y){
  if(y<=T1) return ZA+(ZT-ZA)*Math.pow(Math.max(0,(y-YA)/(T1-YA)),1.35);
  if(y>=T2) return ZA+(ZT-ZA)*Math.pow(Math.max(0,(YB-y)/(YB-T2)),1.35);
  const s=(y-T1)/(T2-T1); return ZT-4*(ZT-ZM)*s*(1-s);
}
function deckSVG(x,y0,y1){

  s+=poly([iso(x+.7,y0,2.31),iso(x+1.3,y0,2.31),iso(x+1.3,y1,2.31),iso(x+.7,y1,2.31)],'#e3d6bd','stroke-width=".6"');
  s+=ln(iso(x,y0,2.6),iso(x,y1,2.6),INK,.8)+ln(iso(x+2,y0,2.6),iso(x+2,y1,2.6),INK,.8);
  return s;
}
function cablesSVG(xa,xb,ya,yb,ydeck){
  let s='';
  for(const cx of [xa,xb]){
    const p=[];for(let y=ya;y<=yb+1e-6;y+=.2)p.push(iso(cx,y,cableZ(y)));
    for(let y=Math.max(ya,ydeck)+.2;y<yb;y+=.45){const z=cableZ(y);if(z>2.7)s+=ln(iso(cx,y,2.3),iso(cx,y,z),'#6b625a',.55);}
    s+=`<polyline points="${pts(p)}" fill="none" stroke-width="1.7"/>`;
  }
  return s;
}
function towerSVG(yc){
  const x=41.15,w=2.7,d=.8,y=yc-d/2,z0=-.5,h=9.75;
  let s=box(40.95,y-.15,-.65,3.1,d+.3,.9,'#b7a487');
  s+=box(x,y,z0,w,d,h,C_STONE,{top:'#d9c8ab'});
  const F=faceL(x,y,z0,w,d),FR=faceR(x,y,z0,w,d);
  for(const [u0,u1] of [[.4,1.15],[1.55,2.3]]){const um=(u0+u1)/2;s+=poly([F.at(u0,2.8),F.at(u1,2.8),F.at(u1,6.7),F.at(um,7.7),F.at(u0,6.7)],'#dbe9f1');}
  for(let v=1.2;v<h;v+=1.3) s+=ln(FR.at(0,v),FR.at(d,v),dk(C_STONE,.15),.6);
  s+=box(x-.08,y-.08,z0+h,w+.16,d+.16,.22,'#bfa98a');
  s+=frect(F,.25,8.0,w-.25,8.5,dk(C_STONE,.08),'stroke-width=".6"');
  return s;
}
function bridgeSVG(){
  let s='';
  s+=deckSVG(41.5,14,T1-.4);
  s+=cablesSVG(41.7,43.3,14,T1,14);
  s+=towerSVG(T1);
  s+=deckSVG(41.5,T1+.4,T2-.4);
  s+=cablesSVG(41.7,43.3,T1,T2,T1+.3);
  s+=towerSVG(T2);
  s+=deckSVG(41.5,T2+.4,22);
  s+=cablesSVG(41.7,43.3,T2,22,T2);
  return s;
}

/* ---------- WATER ---------- */
const WATER=[[-4,14],[70,14],[70,46],[-6,46],[-6,38],[56,38],[56,22],[-4,22]];
const WATER_RECTS=[[-4,14,70,22],[-6,38,70,46],[56,14,70,46]];
function waterSVG(){
  const zt=-.45,zb=-1.25;let s='';
  // visible side faces (outward normal +x or +y)
  const n=WATER.length;
  for(let i=0;i<n;i++){const a=WATER[i],b=WATER[(i+1)%n];
    const nx=(b[1]-a[1]), ny=-(b[0]-a[0]); // outward normal for clockwise-in-screen? test both
    if(nx>0||ny>0){
      s+=poly([iso(a[0],a[1],zt),iso(b[0],b[1],zt),iso(b[0],b[1],zb),iso(a[0],a[1],zb)],nx>0?'#86b5d6':'#95c2e2');
    }}
  s+=poly(WATER.map(p=>iso(p[0],p[1],zt)),C_WATER);
  for(let i=0;i<190;i++){
    const r=WATER_RECTS[i%3];const x=rr(r[0]+.5,r[2]-.5),y=rr(r[1]+.4,r[3]-.4);
    if(x>39.6&&x<56.4&&y>21.6&&y<38.4) continue;
    if(x>59.5&&x<66.5&&y>35.5&&y<42.5) continue;
    const p=iso(x,y,zt),w=rr(5,9);
    s+=`<path class="wave" style="animation-delay:${(-rnd()*4).toFixed(2)}s" d="M${f1(p[0]-w)} ${f1(p[1])}q${f1(w/2)} -3 ${f1(w)} 0t${f1(w)} 0" fill="none" stroke="#eef7fc" stroke-width="1.3"/>`;
  }
  return s;
}

function el(tag,attrs={},html){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(html!=null)e.innerHTML=html;return e;}
const EPS=1e-6;
function rel(a,b){ // -1: a behind b, 1: b behind a, 0: none
  const aB=a.x1<=b.x0+EPS||a.y1<=b.y0+EPS, bB=b.x1<=a.x0+EPS||b.y1<=a.y0+EPS;
  if(aB&&!bB) return -1; if(bB&&!aB) return 1;
  if(!aB&&!bB){ if(a.above&&!b.above) return 1; if(b.above&&!a.above) return -1; }
  return 0;
}
function topo(items){
  const n=items.length, adj=Array.from({length:n},()=>[]), indeg=new Array(n).fill(0);
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const r=rel(items[i],items[j]);if(r<0){adj[i].push(j);indeg[j]++;}else if(r>0){adj[j].push(i);indeg[i]++;}}
  const key=i=>(items[i].x0+items[i].x1+items[i].y0+items[i].y1)/2;
  const done=new Array(n).fill(false), out=[];
  for(let k=0;k<n;k++){
    let best=-1;
    for(let i=0;i<n;i++) if(!done[i]&&indeg[i]===0&&(best<0||key(i)<key(best))) best=i;
    if(best<0) for(let i=0;i<n;i++) if(!done[i]&&(best<0||key(i)<key(best))) best=i;
    done[best]=true; out.push(items[best]); for(const j of adj[best]) indeg[j]--;
  }
  return out;
}
function moverIndex(m,list){
  let idx=0;
  for(let i=0;i<list.length;i++){
    const s=list[i];
    if(s.behindAll){idx=i+1;continue;}
    const sB=s.x1<=m.x0+EPS||s.y1<=m.y0+EPS, mB=m.x1<=s.x0+EPS||m.y1<=s.y0+EPS;
    if(sB&&!mB){idx=i+1;continue;}
    if(!sB&&!mB){
      if(s.above) continue;
      if(m.onTop){idx=i+1;continue;}
      if(s.x0+s.x1+s.y0+s.y1 < m.x0+m.x1+m.y0+m.y1) idx=i+1;
    }
  }
  return idx;
}

let W=innerWidth,H=innerHeight;
const cam={cx:0,cy:0,w:2000};
let camAnim=null, mode='overview', curHood=null, curPlace=null, listOpen=false;
const isMobile=()=>W<760;
function tileBounds(t,extraLabel){
  const P=[iso(t.x0,t.y0,0),iso(t.x0+t.T,t.y0,0),iso(t.x0+t.T,t.y0+t.T,-t.thick),iso(t.x0,t.y0+t.T,-t.thick),iso(t.x0,t.y0,t.top),iso(t.x0+t.T,t.y0,t.top*.6),iso(t.x0,t.y0+t.T,t.top*.6)];
  const b={x0:Math.min(...P.map(p=>p[0])),x1:Math.max(...P.map(p=>p[0])),y0:Math.min(...P.map(p=>p[1])),y1:Math.max(...P.map(p=>p[1]))};
  return b;
}
function overviewBounds(){
  const bs=(isMobile()?['midtown','village','fidi','dumbo'].map(id=>tileById[id]):tiles).map(t=>tileBounds(t));
  const b={x0:Math.min(...bs.map(b=>b.x0)),x1:Math.max(...bs.map(b=>b.x1)),y0:Math.min(...bs.map(b=>b.y0)),y1:Math.max(...bs.map(b=>b.y1))};
  if(isMobile()){b.x0-=150;b.x1+=10;b.y0-=60;return b;}
  b.x0-=60; b.y0-=150; b.y1+=40; return b;
}
function occlusion(){
  const panel=(curPlace||listOpen);
  if(isMobile()) return {top:mode==='overview'?118:96,right:0,bottom:panel?H*.62:(mode==='hood'?118:70),left:0};
  return {top:mode==='overview'?150:84,right:panel?440:0,bottom:mode==='hood'?78:40,left:mode==='overview'?0:0};
}
function fit(b,pad=.06){
  const o=occlusion(); const aw=Math.max(200,W-o.right-o.left), ah=Math.max(200,H-o.top-o.bottom);
  const bw=b.x1-b.x0, bh=b.y1-b.y0; const k=Math.max(bw/aw,bh/ah)*(1+pad);
  const ax=o.left+aw/2, ay=o.top+ah/2;
  return {cx:(b.x0+b.x1)/2-(ax-W/2)*k, cy:(b.y0+b.y1)/2-(ay-H/2)*k, w:k*W};
}
function applyCam(){
  const h=cam.w*H/W;
  svg.setAttribute('viewBox',`${(cam.cx-cam.w/2).toFixed(1)} ${(cam.cy-h/2).toFixed(1)} ${cam.w.toFixed(1)} ${h.toFixed(1)}`);
  const k=cam.w/W;
  const mf=isMobile()?.72:1, ps=Math.min(4.2,Math.max(.32,k*.95*mf)), ls=Math.min(4.2,Math.max(.32,k*.95*mf));
  for(const o of pinObjs) o.node.setAttribute('transform',`translate(${f1(o.sx)},${f1(o.sy)}) scale(${ps.toFixed(3)})`);
  for(const o of labelObjs) o.node.setAttribute('transform',`translate(${f1(o.sx)},${f1(o.sy)}) scale(${ls.toFixed(3)})`);
  svg.classList.toggle('near',k<1.25);
}
function flyTo(t,dur=1250){camAnim={from:{...cam},to:t,t0:performance.now(),dur};}
function stepCam(now){
  const a=camAnim;const u=Math.min(1,(now-a.t0)/a.dur);const e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
  const dist=Math.hypot(a.to.cx-a.from.cx,a.to.cy-a.from.cy);
  const bump=1+Math.min(.45,dist/Math.max(a.from.w,a.to.w)*.55)*Math.sin(Math.PI*u);
  cam.cx=a.from.cx+(a.to.cx-a.from.cx)*e; cam.cy=a.from.cy+(a.to.cy-a.from.cy)*e;
  cam.w=Math.exp(Math.log(a.from.w)+(Math.log(a.to.w)-Math.log(a.from.w))*e)*bump;
  if(u>=1) camAnim=null; applyCam();
}

    for(const id of TOUR){const h=HOODS[id];body+=`<div class="grp"><h4><i style="background:${h.color}"></i>${esc(h.name)} · ${esc(h.sub)}</h4>${PLACES.filter(p=>p.hood===id).map(p=>item(p)).join('')}</div>`;}
  } else {
    const rated=PLACES.filter(p=>p.rating!=null).sort((a,b)=>b.rating-a.rating), un=PLACES.filter(p=>p.rating==null);
    body+=rated.length?rated.map((p,k)=>item(p,k+1)).join(''):`<p class="review ph" style="margin-bottom:14px">The ranking appears here once ratings are in.</p>`;
    if(un.length&&rated.length) body+=`<div class="grp"><h4>Not rated yet</h4>${un.map(p=>item(p)).join('')}</div>`;
    else if(!rated.length) body+=un.map(p=>item(p)).join('');
  }
  listin.innerHTML=`<h2 style="font-family:Fraunces,Georgia,serif;font-size:30px;margin:0 44px 10px 0;font-weight:800">All 13 spots</h2>
    <div class="seg"><button data-by="hood" class="${by==='hood'?'on':''}">By neighborhood</button><button data-by="rank" class="${by==='rank'?'on':''}">By rating</button></div>${body}`;
}
function renderHoodbar(id){
  if(!id){hoodbar.classList.remove('show');return;}
  hoodbar.innerHTML=`<b>${esc(HOODS[id].name)}</b>`+PLACES.filter(p=>p.hood===id).map(p=>`<button data-open="${p.id}" class="${curPlace===p.id?'on':''}">${esc(p.name)}</button>`).join('');
  hoodbar.classList.add('show');
}
function setMode(m,hood){
  mode=m; curHood=hood||null;
  svg.classList.toggle('ov',m==='overview'); document.body.classList.toggle('zoomed',m!=='overview');
  bOverview.hidden=(m==='overview');
  renderHoodbar(m==='hood'?hood:null);
}
function setHash(h){try{if(location.hash.slice(1)!==h){suppressHash=true;location.hash=h;}}catch(e){}}
let suppressHash=false;
function showOverview(){closeCard(true);closeList(true);setMode('overview');refit(1300);setHash('');}
function focusHood(id,o={}){
  if(!HOODS[id]) return;
  if(!o.keepCard&&curPlace&&PLACES.find(p=>p.id===curPlace).hood!==id) closeCard(true);
  if(!o.keepList) closeList(true);
  setMode('hood',id); refit(o.dur||1300); if(!o.noHash&&!curPlace) setHash(id);
}
function openPlace(id){
  const p=PLACES.find(x=>x.id===id); if(!p) return;
  closeList(true);
  curPlace=id; renderCard(p); card.classList.add('open'); document.body.classList.add('panel-open'); card.setAttribute('aria-hidden','false');
  pinObjs.forEach(o=>o.g.classList.toggle('active',o.p.id===id));
  setMode('hood',p.hood); refit(1200); setHash(id);
  card.scrollTop=0;
}
function closeCard(silent){
  if(!curPlace) return; curPlace=null; card.classList.remove('open'); document.body.classList.remove('panel-open'); card.setAttribute('aria-hidden','true');
  pinObjs.forEach(o=>o.g.classList.remove('active'));
  if(curHood) renderHoodbar(curHood);
  if(!silent){refit(800);setHash(curHood||'');}
}
function openList(){closeCard(true);stopTour();listOpen=true;renderList();listP.classList.add('open');listP.setAttribute('aria-hidden','false');refit(800);}
function closeList(silent){if(!listOpen)return;listOpen=false;listP.classList.remove('open');listP.setAttribute('aria-hidden','true');if(!silent)refit(800);}

let tourT=null, tourI=0;
function startTour(){
  closeCard(true);closeList(true);tourI=0;bTour.querySelector('span').textContent='Stop tour';
  bTour.querySelector('svg').innerHTML='<rect x="3.5" y="3.5" width="9" height="9" rx="1"/>';
  const step=()=>{ if(tourI<TOUR.length){focusHood(TOUR[tourI++],{dur:1600});tourT=setTimeout(step,4300);} else {stopTour();showOverview();} };
  step();
}
function stopTour(){ if(tourT==null&&bTour.querySelector('span').textContent!=='Stop tour') return; clearTimeout(tourT);tourT=null;bTour.querySelector('span').textContent='Take the tour';bTour.querySelector('svg').innerHTML='<path d="M4 2.5v11l9-5.5z"/>'; }

bOverview.onclick=()=>{stopTour();showOverview();};
bTour.onclick=()=>{ if(tourT!=null) {stopTour();} else startTour(); };
bList.onclick=()=>{ listOpen?closeList():openList(); };
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>{ b.closest('#card')?closeCard():closeList(); });
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'); if(o){stopTour();openPlace(o.dataset.open);return;}
  const n=e.target.closest('[data-nav]'); if(n&&curPlace){const i=PLACES.findIndex(p=>p.id===curPlace);openPlace(PLACES[(i+(+n.dataset.nav)+PLACES.length)%PLACES.length].id);return;}
  const by=e.target.closest('[data-by]'); if(by){renderList(by.dataset.by);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(curPlace) closeCard(); else if(listOpen) closeList(); else if(mode==='hood') showOverview(); }
  if(curPlace&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){const i=PLACES.findIndex(p=>p.id===curPlace);openPlace(PLACES[(i+(e.key==='ArrowRight'?1:-1)+PLACES.length)%PLACES.length].id);}
  if((e.key==='Enter'||e.key===' ')&&e.target.closest&&e.target.closest('.pin')){e.preventDefault();stopTour();openPlace(e.target.closest('.pin').dataset.id);}
});
window.addEventListener('hashchange',()=>{ if(suppressHash){suppressHash=false;return;} routeHash(); });
function routeHash(){const h=location.hash.slice(1); if(PLACES.some(p=>p.id===h)) openPlace(h); else if(HOODS[h]) focusHood(h); else if(mode!=='overview') showOverview();}

/* pointer: pan, pinch, tap */
const ptrs=new Map(); let drag=null,pinch=null,moved=false;
const toWorld=(px,py)=>[cam.cx+(px-W/2)*cam.w/W, cam.cy+(py-H/2)*cam.w/W];
svg.addEventListener('pointerdown',e=>{
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,cx:cam.cx,cy:cam.cy,target:e.target};moved=false;}
  else if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,w:cam.w,m:toWorld((a.x+b.x)/2,(a.y+b.y)/2)};moved=true;}
});
svg.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2&&pinch){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y)||1;const mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    cam.w=Math.min(maxW(),Math.max(minW(),pinch.w*pinch.d/d));cam.cx=pinch.m[0]-(mx-W/2)*cam.w/W;cam.cy=pinch.m[1]-(my-H/2)*cam.w/W;camAnim=null;stopTour();applyCam();return;}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(!moved&&Math.hypot(dx,dy)>6){moved=true;try{svg.setPointerCapture(e.pointerId);}catch(_){} svg.classList.add('dragging');stopTour();}
    if(moved){camAnim=null;cam.cx=drag.cx-dx*cam.w/W;cam.cy=drag.cy-dy*cam.w/W;applyCam();}}
});
function endPtr(e){
  const had=ptrs.has(e.pointerId); ptrs.delete(e.pointerId);
  if(ptrs.size<2) pinch=null;
  if(ptrs.size===0){ if(had&&drag&&!moved&&e.type==='pointerup') tap(drag.target); drag=null; svg.classList.remove('dragging'); }
}
svg.addEventListener('pointerup',endPtr); svg.addEventListener('pointercancel',endPtr);
svg.addEventListener('wheel',e=>{e.preventDefault();stopTour();camAnim=null;
  const f=Math.exp(e.deltaY*(e.ctrlKey?.012:.0016));const m=toWorld(e.clientX,e.clientY);
  cam.w=Math.min(maxW(),Math.max(minW(),cam.w*f));cam.cx=m[0]-(e.clientX-W/2)*cam.w/W;cam.cy=m[1]-(e.clientY-H/2)*cam.w/W;applyCam();},{passive:false});
function tap(target){
  stopTour();
  const pin=target.closest&&target.closest('.pin'); if(pin) return openPlace(pin.dataset.id);
  const lab=target.closest&&target.closest('.tlabel'); if(lab) return focusHood(lab.dataset.hood);
  const tile=target.closest&&target.closest('.tile.hood');
  if(tile){const h=tile.dataset.hood; if(mode==='overview'||curHood!==h) return focusHood(h); return;}
  if(curPlace) closeCard(); else if(listOpen) closeList();
}
window.addEventListener('resize',()=>{W=innerWidth;H=innerHeight;const t=targetFor();cam.cx=t.cx;cam.cy=t.cy;cam.w=t.w;camAnim=null;applyCam();});

/* =====================================================================
   ANIMATION LOOP
   ===================================================================== */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function placeMover(m,list,parent,x0,y0,time){
  const t=m.p;let pos,op=1;
  if(m.kind==='walk'){const L=m.len;const q=t%(2*L);pos=q<L?q:2*L-q;}
  else {pos=t%m.len;op=Math.max(0,Math.min(1,pos/.9,(m.len-pos)/.9));}
  const along=m.a+m.dir*pos;
  const wx=x0+(m.axis==='x'?along:m.c), wy=y0+(m.axis==='y'?along:m.c);
  const s=iso(wx,wy,m.z||0);
  const bob=m.kind==='walk'?-Math.abs(Math.sin(time*7+m.phase))*1.3:0;
  m.node.setAttribute('transform',`translate(${f1(s[0])},${f1(s[1]+bob)})`);
  if(m.kind!=='walk') m.node.style.opacity=op<1?op.toFixed(2):'';
  m.x0=wx-m.hw;m.x1=wx+m.hw;m.y0=wy-m.hd;m.y1=wy+m.hd;
  const idx=moverIndex(m,list);
  if(idx!==m.idx){m.idx=idx;parent.insertBefore(m.node,list[idx]?list[idx].node:null);}
}
let last=performance.now(), time=0, frameN=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; time+=dt; frameN++;
  if(camAnim) stepCam(now);
  if(!reduce||frameN<3){
    for(const t of tiles) for(const m of t.movers){ m.p+=m.speed*dt; placeMover(m,t.sorted,t.objs,t.x0,t.y0,time); }
    for(const b of boats){ b.p+=b.speed*dt; placeMover(b,topSorted,scene,0,0,time); }
    for(const c of clouds) c.n.setAttribute('transform',`translate(${f1(c.x+Math.sin(time*.12+c.ph)*40)},${f1(c.y)})`);
  }
  requestAnimationFrame(frame);
}

/* paper grain */
(function(){const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');const d=g.createImageData(180,180);
  for(let i=0;i<d.data.length;i+=4){const v=200+Math.random()*55;d.data[i]=v;d.data[i+1]=v*.97;d.data[i+2]=v*.9;d.data[i+3]=Math.random()<.5?18:0;}
  g.putImageData(d,0,0);document.getElementById('grain').style.backgroundImage=`url(${c.toDataURL()})`;})();

/* start */
(function init(){
  const t=fit(overviewBounds(),.02); cam.cx=t.cx;cam.cy=t.cy-40;cam.w=t.w*1.12; applyCam();
  flyTo(t,1600);
  requestAnimationFrame(frame);
  const h=location.hash.slice(1);
  if(h) setTimeout(routeHash,900);
})();
</script>
